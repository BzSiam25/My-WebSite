services:
  - type: web
    name: portfolio-backend-api
    env: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: APP_NAME
        value: Md. Bayezid Hasan Siam - Portfolio
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: LOG_CHANNEL
        value: stderr
      - key: FILESYSTEM_DISK
        value: public
      - key: CACHE_STORE
        value: database
      - key: SESSION_DRIVER
        value: database
      - key: QUEUE_CONNECTION
        value: database
